<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    body {
      background-color: #090d16;
      color: #00f3ff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .jarvis-orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #00f3ff;
      box-shadow: 0 0 30px #00f3ff, inset 0 0 20px #00f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.3s;
    }
    .listening {
      border-color: #ff2a5f;
      box-shadow: 0 0 50px #ff2a5f, inset 0 0 30px #ff2a5f;
      color: #ff2a5f;
      transform: scale(1.1);
    }
    #status { font-size: 15px; color: #a0c4ff; margin-bottom: 12px; }
    #responseBox {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid #00f3ff;
      border-radius: 10px;
      padding: 15px;
      width: 100%;
      max-width: 400px;
      min-height: 70px;
      color: #ffffff;
      font-size: 15px;
      margin-bottom: 15px;
      word-wrap: break-word;
    }
    .input-area, .key-box {
      display: flex;
      width: 100%;
      max-width: 400px;
      gap: 6px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #00f3ff;
      background: #111927;
      color: white;
      font-size: 14px;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: #00f3ff;
      color: #090d16;
      font-weight: bold;
      cursor: pointer;
    }
    .key-box input { font-size: 13px; padding: 8px; }
    .key-box button { font-size: 12px; padding: 8px 10px; background: #1e293b; color: #00f3ff; border: 1px solid #00f3ff; }
    .clear-btn { background: #3b1e26 !important; color: #ff5c8a !important; border-color: #ff5c8a !important; }
  </style>
</head>
<body>

  <div class="jarvis-orb" id="orb" onclick="activateJarvis()">JARVIS</div>
  <div id="status">बोलने के लिए गोले को दबाएं या नीचे लिखें...</div>
  <div id="responseBox">नमस्ते विष्णु! नीचे अपनी नई AIza वाली API Key पेस्ट करके सेव करें।</div>

  <div class="input-area">
    <input type="text" id="textCmd" placeholder="यहाँ लिखकर भी आदेश दें...">
    <button onclick="sendText()">भेजें</button>
  </div>

  <div class="key-box">
    <input type="text" id="apiKeyInput" placeholder="AIza... Key पेस्ट करें">
    <button onclick="saveKey()">सेव</button>
    <button class="clear-btn" onclick="clearKey()">हटाएं</button>
  </div>

  <script>
    window.onload = function() {
      const saved = localStorage.getItem("jarvis_api_key");
      if (saved) {
        document.getElementById('apiKeyInput').value = saved;
        document.getElementById('responseBox').innerText = "नमस्ते विष्णु! मैं तैयार हूँ। बताइए क्या काम करना है?";
      }
    };

    function clearKey() {
      localStorage.removeItem("jarvis_api_key");
      document.getElementById('apiKeyInput').value = "";
      document.getElementById('responseBox').innerText = "पुरानी Key हटा दी गई है। अब नई AIza... Key पेस्ट करके 'सेव' दबाएं।";
    }

    function saveKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (!val.startsWith("AIza")) {
        alert("यह सही Key नहीं है! कृपया 'हटाएं' दबाएं और AIza से शुरू होने वाली Key पेस्ट करें।");
        return;
      }
      localStorage.setItem("jarvis_api_key", val);
      document.getElementById('responseBox').innerText = "नई API Key सेव हो गई! अब 'हेलो' बोलें या लिखकर भेजें।";
      speakHindi("नई API Key सेव हो गई है विष्णु, अब मैं तैयार हूँ।");
    }

    function speakHindi(text) {
      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = 'hi-IN';
      window.speechSynthesis.speak(speech);
    }

    function sendText() {
      const input = document.getElementById('textCmd');
      const cmd = input.value.trim();
      if (!cmd) return;
      document.getElementById('status').innerText = "आपने लिखा: " + cmd;
      input.value = "";
      processCommand(cmd);
    }

    function activateJarvis() {
      const orb = document.getElementById('orb');
      const status = document.getElementById('status');
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        status.innerText = "यह ब्राउज़र माइक सपोर्ट नहीं करता, इसे Chrome में खोलें।";
        return;
      }
      const recognition = new SpeechRec();
      recognition.lang = 'hi-IN';
      orb.classList.add('listening');
      status.innerText = "सुन रहा हूँ... बोलिए!";

      recognition.onresult = function(event) {
        orb.classList.remove('listening');
        const command = event.results[0][0].transcript;
        status.innerText = "आपने कहा: " + command;
        processCommand(command);
      };

      recognition.onerror = function(e) {
        orb.classList.remove('listening');
        status.innerText = "माइक में समस्या (" + e.error + ") — दोबारा दबाएं या नीचे लिखें।";
      };
      recognition.start();
    }

    async function callGemini(apiKey, model, promptText) {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: "तुम जार्विस हो। बहुत छोटे और सटीक हिंदी वाक्यों में जवाब दो (2 लाइन में): " + promptText }] }]
        })
      });
      return await res.json();
    }

    async function processCommand(command) {
      const responseBox = document.getElementById('responseBox');
      const apiKey = localStorage.getItem("jarvis_api_key");
      const lowerCmd = command.toLowerCase();

      if (lowerCmd.includes("यूट्यूब") || lowerCmd.includes("youtube")) {
        const msg = "जी, यूट्यूब खोल रहा हूँ।";
        responseBox.innerText = msg;
        speakHindi(msg);
        window.open("https://www.youtube.com", "_blank");
        return;
      }

      if (lowerCmd.includes("मेरा चैनल")) {
        const msg = "आपका यूट्यूब चैनल खोल रहा हूँ।";
        responseBox.innerText = msg;
        speakHindi(msg);
        window.open("https://www.youtube.com/@vishnugamingytz", "_blank");
        return;
      }

      if (!apiKey) {
        const msg = "पहले नीचे अपनी AIza वाली API Key डालकर 'सेव' दबाएं।";
        responseBox.innerText = msg;
        speakHindi(msg);
        return;
      }

      responseBox.innerText = "सोच रहा हूँ...";
      try {
        let data = await callGemini(apiKey, "gemini-2.5-flash", command);
        if (data.error) {
          data = await callGemini(apiKey, "gemini-2.0-flash", command);
        }
        if (data.error) {
          responseBox.innerText = "Google एरर: " + data.error.message;
          return;
        }
        const aiReply = data.candidates[0].content.parts[0].text.replace(/\*/g, "");
        responseBox.innerText = aiReply;
        speakHindi(aiReply);
      } catch (error) {
        responseBox.innerText = "इंटरनेट या कनेक्शन में समस्या है: " + error.message;
      }
    }
  </script>
</body>
</html>
